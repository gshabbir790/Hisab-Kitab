name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates the android folder (package: com.gshabbir) and keeps our own files
      - name: Generate Android project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --org com --project-name gshabbir .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Hissab Kitab"/' android/app/src/main/AndroidManifest.xml

      - name: Apply app icon
        run: cp -r android_icons/* android/app/src/main/res/

      - run: flutter pub get

      # Separate small APK per CPU type (much smaller than one big APK)
      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: hissab-kitab-apk
          path: build/app/outputs/flutter-apk/*-release.apk
